name: Translate Documents

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Force retranslation of all files
        type: boolean
        default: false
      languages:
        description: Language codes (space-separated, empty for all)
        type: string
        default: ''

concurrency:
  group: translations
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install google-genai

      - name: Check for changes
        id: changes
        run: |
          LAST=$(git log --all --grep="chore: update translations" --format="%H" -1 2>/dev/null || true)
          if [ -z "$LAST" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            CHANGED=$(git diff --name-only "$LAST" HEAD -- README.md CONTRIBUTING.md docs/*.md manifesto/*.md)
            if [ -n "$CHANGED" ]; then
              echo "has_changes=true" >> "$GITHUB_OUTPUT"
            else
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Translate
        if: steps.changes.outputs.has_changes == 'true' || github.event.inputs.force == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INPUT_FORCE: ${{ inputs.force }}
          INPUT_LANGUAGES: ${{ inputs.languages }}
        run: |
          ARGS=""
          if [ "$INPUT_FORCE" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ -n "$INPUT_LANGUAGES" ]; then
            ARGS="$ARGS --lang $INPUT_LANGUAGES"
          fi
          python scripts/translate.py $ARGS

      - name: Upload translation log
        if: always() && hashFiles('scripts/logs/*.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: translation-log
          path: scripts/logs/*.json
          retention-days: 90

      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "$REPO" \
            --title "Translation pipeline failed" \
            --body "Check the [workflow run]($RUN_URL) for details."

      - name: Commit translations
        if: steps.changes.outputs.has_changes == 'true' || github.event.inputs.force == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/*/ manifesto/*/ README.*.md CONTRIBUTING.*.md scripts/glossary.json scripts/logs/ || true
          if git diff --cached --quiet; then
            echo "No translation changes to commit"
          else
            LANGS=$(git diff --cached --name-only | grep -oP '(?<=docs/|manifesto/)[a-z]{2}(?=/)' | sort -u | wc -l)
            FILES=$(git diff --cached --name-only | wc -l)
            git commit -m "chore: update translations

          Updated $FILES translated files across $LANGS languages.
          Triggered by: $EVENT_NAME"
            git push
          fi
