<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSSIF — Open Source Sapient Interaction Framework</title>
<meta name="description" content="A framework for evidence-based civic engagement, critical thinking, and sapient coexistence.">
<meta name="theme-color" content="#0f1117">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark-dimmed.min.css">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface-raised: #1e2230;
  --border: #2d3140;
  --border-subtle: #232738;
  --text: #e1e4ed;
  --text-muted: #8b90a0;
  --text-dim: #5c6178;
  --accent: #6c8cff;
  --accent-glow: rgba(108, 140, 255, 0.15);
  --accent2: #9f7aea;
  --accent2-glow: rgba(159, 122, 234, 0.12);
  --sidebar-width: 280px;
  --header-height: 60px;
  --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

html {
  scroll-behavior: smooth;
  font-size: 16px;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
  overflow-x: hidden;
  min-height: 100vh;
}

/* ================================================================
   HEADER
   ================================================================ */
.site-header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: var(--header-height);
  background: rgba(15, 17, 23, 0.85);
  backdrop-filter: blur(20px) saturate(1.2);
  -webkit-backdrop-filter: blur(20px) saturate(1.2);
  border-bottom: 1px solid var(--border-subtle);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 16px;
}

.hamburger {
  display: none;
  background: none;
  border: none;
  color: var(--text);
  cursor: pointer;
  padding: 4px;
  border-radius: 6px;
  transition: background var(--transition);
}
.hamburger:hover { background: var(--surface); }
.hamburger svg { display: block; }

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: var(--text);
}

.logo-mark {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 14px;
  color: #fff;
  letter-spacing: -0.5px;
  flex-shrink: 0;
}

.logo-text {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 1.5px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.logo-tagline {
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 0.5px;
  display: none;
}

@media (min-width: 900px) {
  .logo-tagline { display: block; }
}

.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

/* Language switcher */
.lang-switcher {
  position: relative;
}

.lang-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 13px;
  font-family: inherit;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all var(--transition);
}
.lang-btn:hover {
  border-color: var(--accent);
  background: var(--surface-raised);
}

.lang-dropdown {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 6px;
  min-width: 180px;
  opacity: 0;
  visibility: hidden;
  transform: translateY(-4px);
  transition: all var(--transition);
  z-index: 2000;
  box-shadow: 0 12px 40px rgba(0,0,0,0.5);
}

.lang-dropdown.open {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}

.lang-option {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text-muted);
  transition: all var(--transition);
  border: none;
  background: none;
  width: 100%;
  font-family: inherit;
  text-align: left;
}
.lang-option:hover {
  background: var(--accent-glow);
  color: var(--text);
}
.lang-option.active {
  color: var(--accent);
  background: var(--accent-glow);
}
.lang-option.placeholder {
  opacity: 0.45;
  cursor: default;
}
.lang-option.placeholder::after {
  content: 'coming soon';
  font-size: 10px;
  color: var(--text-dim);
  margin-left: auto;
  font-style: italic;
}

.github-link {
  color: var(--text-muted);
  transition: color var(--transition);
  display: flex;
  align-items: center;
  padding: 6px;
  border-radius: 6px;
}
.github-link:hover { color: var(--text); }
.github-link svg { display: block; }

/* ================================================================
   SIDEBAR
   ================================================================ */
.sidebar {
  position: fixed;
  top: var(--header-height);
  left: 0;
  bottom: 0;
  width: var(--sidebar-width);
  background: var(--surface);
  border-right: 1px solid var(--border-subtle);
  overflow-y: auto;
  padding: 20px 0;
  z-index: 900;
  transition: transform var(--transition);
}

.sidebar::-webkit-scrollbar { width: 4px; }
.sidebar::-webkit-scrollbar-track { background: transparent; }
.sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.nav-section {
  margin-bottom: 8px;
}

.nav-section-title {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--text-dim);
  padding: 12px 24px 6px;
  user-select: none;
}

.nav-link {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 24px;
  color: var(--text-muted);
  text-decoration: none;
  font-size: 14px;
  transition: all var(--transition);
  border-left: 2px solid transparent;
  cursor: pointer;
}

.nav-link:hover {
  color: var(--text);
  background: rgba(108, 140, 255, 0.05);
}

.nav-link.active {
  color: var(--accent);
  border-left-color: var(--accent);
  background: var(--accent-glow);
}

.nav-link .nav-icon {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
  opacity: 0.5;
}
.nav-link.active .nav-icon,
.nav-link:hover .nav-icon { opacity: 0.8; }

/* Sidebar overlay for mobile */
.sidebar-overlay {
  display: none;
  position: fixed;
  inset: 0;
  top: var(--header-height);
  background: rgba(0, 0, 0, 0.6);
  z-index: 899;
}

/* ================================================================
   MAIN CONTENT
   ================================================================ */
.main-content {
  margin-left: var(--sidebar-width);
  margin-top: var(--header-height);
  min-height: calc(100vh - var(--header-height));
  display: flex;
  flex-direction: column;
}

.content-area {
  flex: 1;
  max-width: 820px;
  width: 100%;
  margin: 0 auto;
  padding: 48px 48px 80px;
}

/* Document transition */
.content-area {
  opacity: 1;
  transform: translateY(0);
  transition: opacity 0.2s ease, transform 0.2s ease;
}
.content-area.loading {
  opacity: 0;
  transform: translateY(8px);
}

/* ================================================================
   HOME / LANDING VIEW
   ================================================================ */
.home-hero {
  text-align: center;
  padding: 64px 0 48px;
}

.home-hero h1 {
  font-size: 42px;
  font-weight: 700;
  letter-spacing: -0.5px;
  line-height: 1.2;
  margin-bottom: 16px;
  background: linear-gradient(135deg, var(--text), var(--accent));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.home-hero .subtitle {
  font-size: 18px;
  color: var(--text-muted);
  max-width: 600px;
  margin: 0 auto 40px;
  line-height: 1.6;
}

/* Seven Imperatives */
.imperatives-section {
  margin: 0 auto 56px;
  max-width: 640px;
}

.imperatives-title {
  font-size: 13px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--accent);
  text-align: center;
  margin-bottom: 24px;
}

.imperative {
  position: relative;
  padding: 16px 20px 16px 56px;
  margin-bottom: 8px;
  border-radius: 10px;
  background: var(--surface);
  border: 1px solid var(--border-subtle);
  transition: all var(--transition);
}

.imperative:hover {
  border-color: var(--border);
  background: var(--surface-raised);
  transform: translateX(4px);
}

.imperative-number {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  flex-shrink: 0;
}

.imperative-text {
  font-size: 15px;
  color: var(--text);
  line-height: 1.5;
}

.imperative-text strong {
  color: var(--accent);
}

.home-cta {
  text-align: center;
  margin-bottom: 56px;
}

.home-cta p {
  font-size: 16px;
  color: var(--text-muted);
  font-style: italic;
  max-width: 520px;
  margin: 0 auto;
  line-height: 1.6;
}

/* Document cards on home */
.doc-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 16px;
  margin-top: 40px;
}

.doc-card {
  background: var(--surface);
  border: 1px solid var(--border-subtle);
  border-radius: 12px;
  padding: 20px;
  cursor: pointer;
  transition: all var(--transition);
  text-decoration: none;
  color: inherit;
  display: block;
}

.doc-card:hover {
  border-color: var(--accent);
  background: var(--surface-raised);
  transform: translateY(-2px);
  box-shadow: 0 8px 32px rgba(108, 140, 255, 0.08);
}

.doc-card-section {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--accent2);
  margin-bottom: 8px;
}

.doc-card h3 {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 6px;
  color: var(--text);
}

.doc-card p {
  font-size: 13px;
  color: var(--text-muted);
  line-height: 1.5;
}

/* ================================================================
   MARKDOWN RENDERING
   ================================================================ */
.markdown-body {
  color: var(--text);
  line-height: 1.75;
}

.markdown-body h1 {
  font-size: 36px;
  font-weight: 700;
  letter-spacing: -0.5px;
  margin: 0 0 8px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border-subtle);
  background: linear-gradient(135deg, var(--text), var(--accent));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.markdown-body h2 {
  font-size: 24px;
  font-weight: 600;
  margin: 48px 0 16px;
  color: var(--text);
  letter-spacing: -0.3px;
}

.markdown-body h3 {
  font-size: 18px;
  font-weight: 600;
  margin: 36px 0 12px;
  color: var(--text);
}

.markdown-body h4 {
  font-size: 15px;
  font-weight: 600;
  margin: 28px 0 8px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.markdown-body p {
  margin: 0 0 16px;
}

.markdown-body a {
  color: var(--accent);
  text-decoration: none;
  border-bottom: 1px solid rgba(108, 140, 255, 0.3);
  transition: all var(--transition);
}
.markdown-body a:hover {
  border-bottom-color: var(--accent);
}

.markdown-body strong {
  font-weight: 600;
  color: #f0f2f8;
}

.markdown-body em {
  color: var(--text-muted);
}

.markdown-body blockquote {
  border-left: 3px solid var(--accent);
  padding: 12px 20px;
  margin: 24px 0;
  background: var(--accent-glow);
  border-radius: 0 8px 8px 0;
  color: var(--text-muted);
  font-style: italic;
}

.markdown-body blockquote p:last-child { margin-bottom: 0; }

.markdown-body ul,
.markdown-body ol {
  padding-left: 24px;
  margin: 0 0 16px;
}

.markdown-body li {
  margin-bottom: 6px;
}

.markdown-body li > ul,
.markdown-body li > ol {
  margin-top: 6px;
  margin-bottom: 0;
}

.markdown-body code {
  font-family: 'JetBrains Mono', 'Fira Code', monospace;
  font-size: 0.88em;
  background: var(--surface);
  padding: 2px 6px;
  border-radius: 4px;
  border: 1px solid var(--border-subtle);
}

.markdown-body pre {
  background: var(--surface) !important;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 20px;
  margin: 24px 0;
  overflow-x: auto;
}

.markdown-body pre code {
  background: none;
  border: none;
  padding: 0;
  font-size: 13px;
  line-height: 1.6;
}

.markdown-body table {
  width: 100%;
  border-collapse: collapse;
  margin: 24px 0;
  font-size: 14px;
}

.markdown-body thead th {
  text-align: left;
  padding: 12px 16px;
  border-bottom: 2px solid var(--border);
  font-weight: 600;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--text-muted);
}

.markdown-body tbody td {
  padding: 10px 16px;
  border-bottom: 1px solid var(--border-subtle);
}

.markdown-body tbody tr:hover {
  background: rgba(108, 140, 255, 0.03);
}

.markdown-body hr {
  border: none;
  border-top: 1px solid var(--border-subtle);
  margin: 40px 0;
}

.markdown-body img {
  max-width: 100%;
  border-radius: 8px;
}

/* ================================================================
   BREADCRUMB
   ================================================================ */
.breadcrumb {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 32px;
  font-size: 13px;
  color: var(--text-dim);
}

.breadcrumb a {
  color: var(--text-muted);
  text-decoration: none;
  transition: color var(--transition);
}
.breadcrumb a:hover { color: var(--accent); }
.breadcrumb .sep { color: var(--text-dim); }
.breadcrumb .current { color: var(--text-muted); }

/* ================================================================
   FOOTER
   ================================================================ */
.site-footer {
  border-top: 1px solid var(--border-subtle);
  padding: 32px 48px;
  text-align: center;
  color: var(--text-dim);
  font-size: 13px;
  line-height: 1.8;
}

.site-footer a {
  color: var(--text-muted);
  text-decoration: none;
  border-bottom: 1px solid var(--border-subtle);
  transition: all var(--transition);
}
.site-footer a:hover {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

/* ================================================================
   LOADING STATE
   ================================================================ */
.loading-spinner {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 80px 0;
}

.spinner {
  width: 24px;
  height: 24px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* Error state */
.error-message {
  text-align: center;
  padding: 80px 24px;
  color: var(--text-muted);
}

.error-message h2 {
  font-size: 20px;
  margin-bottom: 8px;
  color: var(--text);
}

.error-message p {
  max-width: 400px;
  margin: 0 auto;
}

/* Translation notice */
.translation-notice {
  background: var(--accent2-glow);
  border: 1px solid rgba(159, 122, 234, 0.3);
  border-radius: 8px;
  padding: 12px 16px;
  margin-bottom: 24px;
  font-size: 14px;
  color: var(--text-muted);
}

/* ================================================================
   RESPONSIVE
   ================================================================ */
@media (max-width: 900px) {
  .sidebar {
    transform: translateX(-100%);
  }
  .sidebar.open {
    transform: translateX(0);
  }
  .sidebar-overlay.open {
    display: block;
  }
  .main-content {
    margin-left: 0;
  }
  .hamburger {
    display: block;
  }
  .content-area {
    padding: 32px 24px 64px;
  }
  .site-footer {
    padding: 24px;
  }
  .home-hero h1 {
    font-size: 30px;
  }
  .home-hero .subtitle {
    font-size: 16px;
  }
  .doc-grid {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 480px) {
  .content-area {
    padding: 24px 16px 48px;
  }
  .markdown-body h1 {
    font-size: 26px;
  }
  .markdown-body h2 {
    font-size: 20px;
  }
  .imperative {
    padding: 14px 14px 14px 48px;
  }
  .imperative-number {
    left: 12px;
    width: 24px;
    height: 24px;
    font-size: 11px;
  }
  .logo-text {
    font-size: 15px;
  }
}

/* Smooth scroll target offset */
.markdown-body h1[id],
.markdown-body h2[id],
.markdown-body h3[id],
.markdown-body h4[id] {
  scroll-margin-top: calc(var(--header-height) + 24px);
}

/* Print styles */
@media print {
  .site-header, .sidebar, .sidebar-overlay, .hamburger, .lang-switcher { display: none !important; }
  .main-content { margin-left: 0 !important; }
  .content-area { max-width: 100%; padding: 0; }
  body { background: #fff; color: #111; }
}
</style>
</head>

    'file-text': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>',
    'git-pull-request': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M13 6h3a2 2 0 0 1 2 2v7"/><line x1="6" y1="9" x2="6" y2="21"/></svg>',
  };

  // ================================================================
  // STATE
  // ================================================================
  var currentLang = 'en';
  var currentRoute = 'home';
  var cache = {};

  // ================================================================
  // SAFE DOM HELPERS
  // ================================================================
  function clearElement(el) {
    while (el.firstChild) el.removeChild(el.firstChild);
  }

  function createEl(tag, attrs, children) {
    var el = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function(k) {
        if (k === 'className') el.className = attrs[k];
        else if (k === 'textContent') el.textContent = attrs[k];
        else if (k.indexOf('on') === 0) el.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
        else el.setAttribute(k, attrs[k]);
      });
    }
    if (children) {
      if (typeof children === 'string') el.textContent = children;
      else if (Array.isArray(children)) children.forEach(function(c) {
        if (c) el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
      });
    }
    return el;
  }

  // For trusted HTML from marked.js (our own markdown files from same origin)
  function setTrustedHTML(el, html) {
    // This renders markdown from the project's own files fetched from the same origin.
    // The content is trusted first-party documentation, not user-generated input.
    el.innerHTML = html; // eslint-disable-line
  }

  function setSVGContent(el, svgString) {
    el.innerHTML = svgString; // eslint-disable-line
  }

  // ================================================================
  // MARKED CONFIGURATION
  // ================================================================
  marked.setOptions({
    highlight: function(code, lang) {
      if (lang && hljs.getLanguage(lang)) {
        return hljs.highlight(code, { language: lang }).value;
      }
      return hljs.highlightAuto(code).value;
    },
    breaks: false,
    gfm: true,
  });

  var renderer = new marked.Renderer();

  renderer.link = function(href, title, text) {
    if (typeof href === 'object') {
      var token = href;
      href = token.href;
      title = token.title;
      text = token.text;
    }
    if (href && href.indexOf('http') !== 0 && href.indexOf('#') !== 0 && href.indexOf('mailto:') !== 0) {
      var resolved = resolveRelativeLink(href);
      if (resolved) {
        return '<a href="' + resolved + '">' + text + '</a>';
      }
    }
    var titleAttr = title ? ' title="' + title + '"' : '';
    if (href && href.indexOf('http') === 0) {
      return '<a href="' + (href || '') + '"' + titleAttr + ' target="_blank" rel="noopener">' + text + '</a>';
    }
    return '<a href="' + (href || '') + '"' + titleAttr + '>' + text + '</a>';
  };

  marked.setOptions({ renderer: renderer });

  function resolveRelativeLink(href) {
    var parts = href.split('#');
    var path = parts[0];
    var anchor = parts[1] || '';
    var cleanPath = path.replace(/^\.\//, '').replace(/^\.\.\//g, '');

    for (var i = 0; i < ALL_ITEMS.length; i++) {
      var item = ALL_ITEMS[i];
      if (item.file === cleanPath || item.file.indexOf('/' + cleanPath) === item.file.length - cleanPath.length - 1) {
        return '#/' + item.key + (anchor ? '#' + anchor : '');
      }
      var itemFileName = item.file.split('/').pop();
      var linkFileName = cleanPath.split('/').pop();
      if (itemFileName === linkFileName) {
        return '#/' + item.key + (anchor ? '#' + anchor : '');
      }
    }
    return null;
  }

  // ================================================================
  // BUILD SIDEBAR
  // ================================================================
  function buildSidebar() {
    var sidebar = document.getElementById('sidebar');
    clearElement(sidebar);

    NAV_STRUCTURE.forEach(function(group) {
      var section = createEl('div', { className: 'nav-section' });

      if (group.section) {
        section.appendChild(createEl('div', { className: 'nav-section-title', textContent: group.section }));
      }

      group.items.forEach(function(item) {
        var link = createEl('a', {
          className: 'nav-link',
          'data-key': item.key,
          href: '#/' + (item.key === 'home' ? '' : item.key),
        });
        link.addEventListener('click', function(e) {
          e.preventDefault();
          window.location.hash = item.key === 'home' ? '#/' : '#/' + item.key;
          closeSidebar();
        });

        var iconSpan = createEl('span', { className: 'nav-icon' });
        if (ICONS[item.icon]) setSVGContent(iconSpan, ICONS[item.icon]);
        link.appendChild(iconSpan);
        link.appendChild(createEl('span', null, item.label));
        section.appendChild(link);
      });

      sidebar.appendChild(section);
    });

    updateActiveNav();
  }

  function updateActiveNav() {
    document.querySelectorAll('.nav-link').forEach(function(el) {
      if (el.getAttribute('data-key') === currentRoute) {
        el.classList.add('active');
      } else {
        el.classList.remove('active');
      }
    });
  }

  // ================================================================
  // LANGUAGE
  // ================================================================
  function buildLangDropdown() {
    var dropdown = document.getElementById('langDropdown');
    clearElement(dropdown);

    LANGUAGES.forEach(function(lang) {
      var btn = createEl('button', {
        className: 'lang-option' + (lang.code === currentLang ? ' active' : '') + (!lang.available ? ' placeholder' : ''),
        'data-lang': lang.code,
        textContent: lang.label,
      });
      btn.addEventListener('click', function() {
        selectLanguage(lang.code, lang.available);
      });
      dropdown.appendChild(btn);
    });
  }

  function selectLanguage(code, available) {
    if (!available) return;
    currentLang = code;
    document.getElementById('currentLangLabel').textContent = LANGUAGES.find(function(l) { return l.code === code; }).label;
    document.documentElement.lang = code;
    buildLangDropdown();
    closeLangDropdown();
    navigateTo(currentRoute);
  }

  function toggleLangDropdown() {
    document.getElementById('langDropdown').classList.toggle('open');
  }

  function closeLangDropdown() {
    document.getElementById('langDropdown').classList.remove('open');
  }

  document.addEventListener('click', function(e) {
    if (!e.target.closest('.lang-switcher')) {
      closeLangDropdown();
    }
  });

  // Expose for inline onclick
  window.toggleLangDropdown = toggleLangDropdown;

  // ================================================================
  // SIDEBAR MOBILE
  // ================================================================
  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebarOverlay').classList.toggle('open');
  }

  function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebarOverlay').classList.remove('open');
  }

  window.toggleSidebar = toggleSidebar;
  window.closeSidebar = closeSidebar;

  // ================================================================
  // FILE RESOLUTION
  // ================================================================
  function getFileUrl(item) {
    if (currentLang === 'en') return item.file;

    if (item.fileI18n) {
      return item.fileI18n.replace('{lang}', currentLang);
    }

    if (item.file.indexOf('docs/') === 0) {
      var filename = item.file.replace('docs/', '');
      return 'docs/' + currentLang + '/' + filename;
    }

    if (item.file.indexOf('manifesto/') === 0) {
      var mFilename = item.file.replace('manifesto/', '');
      return 'manifesto/' + currentLang + '/' + mFilename;
    }

    return item.file;
  }

  function fetchMarkdown(url) {
    if (cache[url]) return Promise.resolve(cache[url]);
    return fetch(url).then(function(response) {
      if (!response.ok) throw new Error('Failed to fetch ' + url + ': ' + response.status);
      return response.text();
    }).then(function(text) {
      cache[url] = text;
      return text;
    });
  }

  // ================================================================
  // NAVIGATION
  // ================================================================
  function navigateTo(routeKey) {
    var contentArea = document.getElementById('contentArea');

    if (routeKey === 'home' || routeKey === '' || !routeKey) {
      currentRoute = 'home';
      updateActiveNav();
      contentArea.classList.add('loading');
      setTimeout(function() {
        renderHome();
        contentArea.classList.remove('loading');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }, 60);
      return;
    }

    var item = ITEM_MAP[routeKey];
    if (!item) {
      renderError('Document not found', 'The requested document does not exist.');
      return;
    }

    currentRoute = routeKey;
    updateActiveNav();
    contentArea.classList.add('loading');

    var fileUrl = getFileUrl(item);

    setTimeout(function() {
      fetchMarkdown(fileUrl).then(function(md) {
        renderDocument(md, item);
        contentArea.classList.remove('loading');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }).catch(function() {
        if (currentLang !== 'en') {
          fetchMarkdown(item.file).then(function(md) {
            renderDocument(md, item, true);
            contentArea.classList.remove('loading');
            window.scrollTo({ top: 0, behavior: 'smooth' });
          }).catch(function() {
            renderError('Document not found', 'Could not load this document.');
            contentArea.classList.remove('loading');
          });
        } else {
          renderError('Document not found', 'Could not load this document.');
          contentArea.classList.remove('loading');
        }
      });
    }, 60);
  }

  window.navigateTo = navigateTo;

  function renderDocument(md, item, isFallback) {
    var contentArea = document.getElementById('contentArea');
    clearElement(contentArea);

    // Breadcrumb
    contentArea.appendChild(buildBreadcrumb(item));

    // Fallback notice
    if (isFallback) {
      var langLabel = '';
      LANGUAGES.forEach(function(l) { if (l.code === currentLang) langLabel = l.label; });
      var notice = createEl('div', { className: 'translation-notice' });
      notice.textContent = 'This document is not yet available in ' + langLabel + '. Showing the English version.';
      contentArea.appendChild(notice);
    }

    // Render markdown
    var mdDiv = createEl('div', { className: 'markdown-body' });
    var html = marked.parse(md);
    setTrustedHTML(mdDiv, html);
    contentArea.appendChild(mdDiv);

    // Highlight code blocks
    contentArea.querySelectorAll('pre code').forEach(function(block) {
      hljs.highlightElement(block);
    });
  }

  function buildBreadcrumb(item) {
    var sectionName = null;
    NAV_STRUCTURE.forEach(function(group) {
      group.items.forEach(function(i) {
        if (i.key === item.key) sectionName = group.section;
      });
    });

    var bc = createEl('div', { className: 'breadcrumb' });
    var homeLink = createEl('a', { href: '#/' }, 'OSSIF');
    bc.appendChild(homeLink);

    if (sectionName) {
      bc.appendChild(createEl('span', { className: 'sep' }, '/'));
      bc.appendChild(createEl('span', { className: 'current' }, sectionName));
    }

    bc.appendChild(createEl('span', { className: 'sep' }, '/'));
    bc.appendChild(createEl('span', { className: 'current' }, item.label));

    return bc;
  }

  function renderError(title, message) {
    var contentArea = document.getElementById('contentArea');
    clearElement(contentArea);
    var errDiv = createEl('div', { className: 'error-message' });
    errDiv.appendChild(createEl('h2', null, title));
    errDiv.appendChild(createEl('p', null, message));
    contentArea.appendChild(errDiv);
  }

  // ================================================================
  // HOME PAGE
  // ================================================================
  function renderHome() {
    var contentArea = document.getElementById('contentArea');
    clearElement(contentArea);

    // Hero
    var hero = createEl('div', { className: 'home-hero' });
    var h1 = createEl('h1');
    setTrustedHTML(h1, 'Open Source Sapient<br>Interaction Framework');
    hero.appendChild(h1);
    hero.appendChild(createEl('p', { className: 'subtitle' }, 'A framework for evidence-based civic engagement, critical thinking, and sapient coexistence.'));
    contentArea.appendChild(hero);

    // Imperatives
    var impSection = createEl('div', { className: 'imperatives-section' });
    impSection.appendChild(createEl('div', { className: 'imperatives-title' }, 'The Seven Imperatives'));

    IMPERATIVES.forEach(function(imp) {
      var card = createEl('div', { className: 'imperative' });
      var numEl = createEl('div', { className: 'imperative-number' }, String(imp.num));
      var textEl = createEl('div', { className: 'imperative-text' });
      setTrustedHTML(textEl, imp.text);
      card.appendChild(numEl);
      card.appendChild(textEl);
      impSection.appendChild(card);
    });
    contentArea.appendChild(impSection);

    // CTA
    var cta = createEl('div', { className: 'home-cta' });
    var ctaP = createEl('p');
    setTrustedHTML(ctaP, 'If you can agree to these &mdash; not perfectly, not without struggle, but as aspirations worth striving for &mdash; then OSSIF is for you.');
    cta.appendChild(ctaP);
    contentArea.appendChild(cta);

    // Documents title
    contentArea.appendChild(createEl('div', { className: 'imperatives-title', style: 'margin-bottom:20px' }, 'Documents'));

    // Document grid
    var grid = createEl('div', { className: 'doc-grid' });
    DOC_CARDS.forEach(function(card) {
      var a = createEl('a', {
        className: 'doc-card',
        href: '#/' + card.key,
      });
      a.addEventListener('click', function(e) {
        e.preventDefault();
        window.location.hash = '#/' + card.key;
      });
      a.appendChild(createEl('div', { className: 'doc-card-section' }, card.section));
      a.appendChild(createEl('h3', null, ITEM_MAP[card.key] ? ITEM_MAP[card.key].label : card.key));
      a.appendChild(createEl('p', null, card.desc));
      grid.appendChild(a);
    });
    contentArea.appendChild(grid);
  }

  // ================================================================
  // HASH ROUTER
  // ================================================================
  function parseHash() {
    var hash = window.location.hash || '#/';
    var route = hash.replace(/^#\/?/, '');

    // Check for language prefix in docs path
    var langMatch = route.match(/^docs\/([a-z]{2})\/(.*)/);
    if (langMatch) {
      var lang = langMatch[1];
      var rest = langMatch[2];
      var langObj = null;
      LANGUAGES.forEach(function(l) { if (l.code === lang) langObj = l; });
      if (langObj && langObj.available) {
        currentLang = lang;
        document.getElementById('currentLangLabel').textContent = langObj.label;
        document.documentElement.lang = lang;
        buildLangDropdown();
        route = 'docs/' + rest;
      }
    }

    // Check for language prefix in manifesto path
    var mMatch = route.match(/^manifesto\/([a-z]{2})\/(.*)/);
    if (mMatch) {
      var mLang = mMatch[1];
      var mRest = mMatch[2];
      var mLangObj = null;
      LANGUAGES.forEach(function(l) { if (l.code === mLang) mLangObj = l; });
      if (mLangObj && mLangObj.available) {
        currentLang = mLang;
        document.getElementById('currentLangLabel').textContent = mLangObj.label;
        document.documentElement.lang = mLang;
        buildLangDropdown();
        route = 'manifesto/' + mRest;
      }
    }

    route = route.replace(/\.md$/, '').replace(/\/$/, '');

    if (!route || route === '') return 'home';
    if (ITEM_MAP[route]) return route;

    // Try partial match
    var keys = Object.keys(ITEM_MAP);
    for (var i = 0; i < keys.length; i++) {
      if (keys[i].indexOf('/' + route) === keys[i].length - route.length - 1 || keys[i] === route) {
        return keys[i];
      }
    }

    return route;
  }

  function handleHashChange() {
    var route = parseHash();
    navigateTo(route);
  }

  window.addEventListener('hashchange', handleHashChange);

  // ================================================================
  // INIT
  // ================================================================
  buildSidebar();
  buildLangDropdown();
  handleHashChange();

})();
</script>
</body>
</html>
